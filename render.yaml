services:
  - type: web
    name: evida-scribe-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: OUTPUT_DIR
        # Free tier: ephemeral filesystem only (data may be lost on restart/redeploy)
        value: /tmp/output
      # Set this to your frontend origin(s) once deployed, comma-separated.
      # Example: https://your-frontend.onrender.com,https://your-vercel-app.vercel.app
      - key: CORS_ORIGINS
        value: "*"
      # Optional: enable ElevenLabs webhook signature verification
      # - key: MEETING_PROVIDER_WEBHOOK_SECRET
      #   sync: false
      # Optional: enable plan generation on webhook ingestion
      # - key: OPENAI_API_KEY
      #   sync: false

  - type: web
    name: evida-scribe-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: next-js-meeting-dashboard
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      # Point the frontend at the backend service URL.
      # If you rename services or use a custom domain, update this in Render.
      - key: MEETING_API_BASE_URL
        value: https://evida-scribe-api.onrender.com
